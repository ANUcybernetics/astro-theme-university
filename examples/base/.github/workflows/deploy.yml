name: deploy

# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: in the repository settings, set Pages → Source to
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # node and pnpm come from mise.toml, so CI and your machine agree.
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-cache-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: astro-cache-
      - run: pnpm install --frozen-lockfile
      # A project site is served under /<repo>/, and every internal link has
      # to carry that prefix; the theme's link checker fails the build if one
      # doesn't. For a user or organisation site (a repo named
      # <owner>.github.io) set BASE_PATH to "/".
      - run: pnpm build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
