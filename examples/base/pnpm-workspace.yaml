# pnpm 11 build-script approval. Sharp's install/check.js falls through to
# a source build when a system libvips is present; skip the script and rely
# on the prebuilt @img/sharp-* platform binary at runtime.
allowBuilds:
  esbuild: true
  sharp: false

# Pin astromotion to the GitHub repo (no npm release), at an exact release
# tag — a floating ref here freezes at whatever commit main pointed to when
# the lockfile entry was first resolved, then silently never moves.
overrides:
  astromotion: github:ANUcybernetics/astromotion#v0.31.4
