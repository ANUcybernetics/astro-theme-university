name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # node and pnpm both come from mise.toml — re-declaring them with
      # setup-node + pnpm/action-setup meant two places to bump and a pnpm
      # version ("11") that only agreed with mise's "latest" by luck.
      - uses: jdx/mise-action@v4.3.0
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # includes the fresh examples/base consumer build (tests/examples.test.ts)
      - run: pnpm test
